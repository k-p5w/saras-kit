name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: merge-game/package-lock.json

      - name: Build merge-game
        working-directory: merge-game
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir _site
          # 既存の静的ページはそのまま配置
          cp -r food grandprix merge _site/
          # merge-game は dist の中身だけを配置
          mkdir _site/merge-game
          cp -r merge-game/dist/. _site/merge-game/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4