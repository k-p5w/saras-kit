<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マージ×サバクラ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        /* --- 上部：ステータスバー --- */
        .status-bar {
            display: flex;
            gap: 20px;
            background: #2d2d2d;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 0.9rem;
        }
        .status-item span { font-weight: bold; color: #4CAF50; }
        .gold-item span { color: #ffd700; }

        /* --- メインコンテナ（左右分割：パズル 7 ： ショップ 3） --- */
        .main-layout {
            display: flex;
            flex: 7;
            gap: 10px;
            min-height: 0;
        }

        /* パズル盤面エリア */
        .puzzle-section {
            flex: 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 75px);
            grid-template-rows: repeat(5, 75px);
            gap: 6px;
            background: #111;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #444;
        }
        .cell {
            width: 75px;
            height: 75px;
            background: #2a2a2a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            user-select: none;
            cursor: default;
        }

        /* 階層①（札：アラビア数字）のデザイン */
        .tile-card-wood { background: #8d5524; color: #fff; border: 2px dashed #ffcc99; font-size: 1.4rem; }
        .tile-card-stone { background: #708090; color: #fff; border: 2px dashed #dcdcdc; font-size: 1.4rem; }

        /* 階層②（資材：漢数字）のデザイン ※クリックで手動回収可能 */
        .tile-mat-wood { 
            background: #5c3a21; color: #ffe0b2; border: 2px solid #ffb74d; 
            font-size: 1.6rem; box-shadow: inset 0 0 8px rgba(255,183,77,0.3); cursor: pointer; 
        }
        .tile-mat-stone { 
            background: #3b4c5c; color: #e0f7fa; border: 2px solid #4dd0e1; 
            font-size: 1.6rem; box-shadow: inset 0 0 8px rgba(77,208,225,0.3); cursor: pointer; 
        }

        /* --- 右側：ショップ・拠点メニュー --- */
        .side-section {
            flex: 3;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .shop-title { font-size: 0.95rem; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 4px; }
        
        .shop-item {
            background: #333;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }
        .shop-item button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }

        /* --- 下部：冒険ログエリア --- */
        .log-section {
            flex: 3;
            background: #111;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column-reverse;
        }
        .log-entry { margin-bottom: 3px; color: #ccc; }
        .log-entry.event { color: #ffd700; }
        .log-entry.reward { color: #4dd0e1; }
        .log-entry.gameover { color: #ff6b6b; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ステータス表示 -->
    <div class="status-bar">
        <div class="status-item">木材: <span id="inv-wood">0</span></div>
        <div class="status-item">石材: <span id="inv-stone">0</span></div>
        <div class="status-item gold-item">所持金: <span id="gold">50</span>G</div>
        <div class="status-item">パーティ数: <span id="hero-count">0</span>人</div>
    </div>

    <!-- メインレイアウト -->
    <div class="main-layout">
        <!-- 7割：パズル盤面 -->
        <div class="puzzle-section">
            <div class="grid" id="grid"></div>
        </div>

        <!-- 3割：ショップ・拠点 -->
        <div class="side-section">
            <div class="shop-title">ショップ・拠点</div>
            
            <div class="shop-item">
                <div><b>木材売却</b> (1個)<br><small>➔ 2 GOLD</small></div>
                <button onclick="sellMaterial('wood', 1, 2)">売却</button>
            </div>

            <div class="shop-item">
                <div><b>石材売却</b> (1個)<br><small>➔ 3 GOLD</small></div>
                <button onclick="sellMaterial('stone', 1, 3)">売却</button>
            </div>

            <div class="shop-item">
                <div><b>使い捨て勇者</b><br><small>費用: 20G</small></div>
                <button onclick="hireHero('single')">雇う</button>
            </div>

            <div class="shop-item">
                <div><b>終身雇用勇者</b><br><small>費用: 100G</small></div>
                <button onclick="hireHero('permanent')">雇う</button>
            </div>

            <div class="shop-item">
                <div><b>木剣クラフト</b><br><small>木材: 10個</small></div>
                <button onclick="craftWeapon('木剣', 'wood', 10)">作成</button>
            </div>
        </div>
    </div>

    <!-- 下部：冒険ログ -->
    <div class="log-section" id="log-section">
        <div class="log-entry">冒険の準備が整いました。</div>
    </div>

<script>
    /* ==========================================
     * 1. 定数・グローバル変数定義
     * ========================================== */
    const SIZE = 5; // 5x5盤面
    let board = Array(SIZE * SIZE).fill(null); // 盤面の状態（null または タイルオブジェクト）
    let inventory = { wood: 0, stone: 0 };    // 資材の所持数
    let gold = 50;                             // 所持金
    let heroes = [];                           // 雇用した勇者リスト
    let isGameOver = false;                    // 詰み（ゲームオーバー）フラグ
    
    // 階層②（資材）の漢数字マッピング
    const kanjiMap = { 1: '一', 2: '二', 4: '四', 8: '八', 16: '十六' };

    /* ==========================================
     * 2. 初期化・スポーン処理
     * ========================================== */
    function initGame() {
        board.fill(null);
        inventory = { wood: 0, stone: 0 };
        gold = 50;
        heroes = [];
        isGameOver = false;
        
        // 初期タイルをランダムに配置
        spawnTile('wood');
        spawnTile('stone');
        updateView();
        
        // 冒険オート進行ループ（2.5秒ごと）
        setInterval(adventureLoop, 2500);
    }

    // 指定されたタイプの新規タイル（階層1の「1」）を空きマスにランダム生成
    function spawnTile(type) {
        let emptyIndexes = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
        
        // 空きマスがない場合
        if (emptyIndexes.length === 0) {
            checkGameOver();
            return;
        }
        
        let idx = emptyIndexes[Math.floor(Math.random() * emptyIndexes.length)];
        board[idx] = { type: type, tier: 1, val: 1 };
    }

    /* ==========================================
     * 3. 描画更新処理 (View)
     * ========================================== */
    function updateView() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        
        board.forEach((tile, idx) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (tile) {
                if (tile.tier === 1) {
                    // 階層①（札：アラビア数字）
                    cell.classList.add(`tile-card-${tile.type}`);
                    cell.innerText = tile.val;
                } else {
                    // 階層②（資材：漢数字）
                    cell.classList.add(`tile-mat-${tile.type}`);
                    cell.innerText = kanjiMap[tile.val] || tile.val;
                    // クリックで手動回収（途中回収）可能
                    cell.onclick = () => harvestTile(idx);
                }
            }
            gridEl.appendChild(cell);
        });

        // ステータス表示の更新
        document.getElementById('inv-wood').innerText = inventory.wood;
        document.getElementById('inv-stone').innerText = inventory.stone;
        document.getElementById('gold').innerText = gold;
        document.getElementById('hero-count').innerText = heroes.length;
    }

    /* ==========================================
     * 4. ゲームルール・パズル処理 (Logic)
     * ========================================== */

    // 漢数字タイルの手動回収処理
    function harvestTile(idx) {
        if (isGameOver) return;
        let tile = board[idx];
        if (tile && tile.tier === 2) {
            inventory[tile.type] += tile.val;
            addLog(`【手動回収】${tile.type === 'wood' ? '木材' : '石材'}を${tile.val}個ストックしました。`, 'reward');
            board[idx] = null;
            updateView();
        }
    }

    // 詰み（ゲームオーバー）判定
    function checkGameOver() {
        // 1. 空きマスがあるかチェック
        let hasEmpty = board.some(v => v === null);
        if (hasEmpty) return; // 空きがあれば詰んでない

        // 2. 隣接する同種・同階層・同値のペアがあるかチェック
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                let current = board[r * SIZE + c];
                if (!current) continue;
                // 右隣をチェック
                if (c < SIZE - 1) {
                    let right = board[r * SIZE + (c + 1)];
                    if (right && right.type === current.type && right.tier === current.tier && right.val === current.val) return;
                }
                // 下隣をチェック
                if (r < SIZE - 1) {
                    let down = board[(r + 1) * SIZE + c];
                    if (down && down.type === current.type && down.tier === current.tier && down.val === current.val) return;
                }
            }
        }

        // どちらも該当しない場合は「詰み」
        isGameOver = true;
        addLog(`⚠️ 【詰み】盤面が埋まり、動かせなくなりました！「リセット」してください。`, 'gameover');
    }

    /* ==========================================
     * 5. キーボード入力・スワイプ処理
     * ========================================== */
    document.addEventListener('keydown', e => {
        if (isGameOver) return;
        let moved = false;
        let supplyType = null;

        // 上下スワイプ時は木材系(wood)が供給、左右スワイプ時は石材系(stone)が供給
        if (e.key === 'ArrowLeft') { moved = slide('left'); supplyType = 'stone'; }
        else if (e.key === 'ArrowRight') { moved = slide('right'); supplyType = 'stone'; }
        else if (e.key === 'ArrowUp') { moved = slide('up'); supplyType = 'wood'; }
        else if (e.key === 'ArrowDown') { moved = slide('down'); supplyType = 'wood'; }

        if (moved) {
            spawnTile(supplyType);
            updateView();
            checkGameOver();
        }
    });

    // スライド処理（左方向へのマージ計算に全方向を合わせるため盤面を回転させる共通ロジック）
    function slide(direction) {
        let rotCount = 0;
        if (direction === 'right') rotCount = 2;
        if (direction === 'up') rotCount = 3;
        if (direction === 'down') rotCount = 1;

        for (let i = 0; i < rotCount; i++) rotateBoard();

        let changed = false;
        for (let r = 0; r < SIZE; r++) {
            let row = [];
            for (let c = 0; c < SIZE; c++) row.push(board[r * SIZE + c]);
            let { newRow, moved } = processRow(row);
            if (moved) changed = true;
            for (let c = 0; c < SIZE; c++) board[r * SIZE + c] = newRow[c];
        }

        for (let i = 0; i < (4 - rotCount) % 4; i++) rotateBoard();
        return changed;
    }

    // 盤面を90度時計回りに回転させるヘルパー
    function rotateBoard() {
        let newBoard = Array(SIZE * SIZE).fill(null);
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                newBoard[c * SIZE + (SIZE - 1 - r)] = board[r * SIZE + c];
            }
        }
        board = newBoard;
    }

    // 1行分のマージ・合体ルール処理
    function processRow(row) {
        let filtered = row.filter(t => t !== null);
        let newRow = [];
        let moved = false;

        for (let i = 0; i < filtered.length; i++) {
            let current = filtered[i];
            let next = filtered[i + 1];

            // 同じ種類・同じ階層・同じ数値の場合に合体
            if (next && current.type === next.type && current.tier === next.tier && current.val === next.val) {
                let newVal = current.val * 2;
                let newTier = current.tier;

                if (newTier === 1 && newVal >= 16) {
                    // 階層1の16到達 ⇒ 階層2（資材・漢数字の「一」）へ進化
                    newTier = 2;
                    newVal = 1;
                    moved = true;
                } else if (newTier === 2 && newVal >= 16) {
                    // 階層2の16到達 ⇒ 自動完走ボーナス（資材＋30個）
                    inventory[current.type] += 30;
                    addLog(`🎉 【16完走ボーナス】${current.type === 'wood' ? '木材' : '石材'}x30獲得！`, 'reward');
                    newRow.push(null);
                    i++;
                    moved = true;
                    continue;
                } else {
                    moved = true;
                }

                newRow.push({ type: current.type, tier: newTier, val: newVal });
                i++;
            } else {
                newRow.push(current);
            }
        }

        if (newRow.length !== row.filter(t => t !== null).length) moved = true;
        while (newRow.length < SIZE) newRow.push(null);

        // 位置や値の変化比較
        for (let i = 0; i < SIZE; i++) {
            if ((row[i] === null) !== (newRow[i] === null) || 
                (row[i] && newRow[i] && (row[i].val !== newRow[i].val || row[i].tier !== newRow[i].tier))) {
                moved = true;
            }
        }

        return { newRow, moved };
    }

    /* ==========================================
     * 6. ショップ・経済・冒険システム
     * ========================================== */
    function sellMaterial(type, amount, price) {
        if (inventory[type] >= amount) {
            inventory[type] -= amount;
            gold += price;
            addLog(`【売却】${type === 'wood' ? '木材' : '石材'}x${amount} を売却 (+${price}G)`);
            updateView();
        } else {
            addLog(`資材が足りません！`);
        }
    }

    function hireHero(type) {
        let cost = type === 'single' ? 20 : 100;
        if (gold >= cost) {
            gold -= cost;
            heroes.push({ type: type, name: type === 'single' ? '使い捨て勇者' : '終身勇者' });
            addLog(`【雇用】${type === 'single' ? '使い捨て勇者' : '終身雇用勇者'}を雇いました！`, 'event');
            updateView();
        } else {
            addLog(`ゴールドが足りません！`);
        }
    }

    function craftWeapon(weaponName, matType, cost) {
        if (inventory[matType] >= cost) {
            inventory[matType] -= cost;
            addLog(`【クラフト】${weaponName} を作成・支給しました！`, 'event');
            updateView();
        } else {
            addLog(`クラフト素材が足りません！`);
        }
    }

    // 冒険オート進行ループ
    function adventureLoop() {
        if (heroes.length === 0) return;
        let h = heroes[Math.floor(Math.random() * heroes.length)];
        let events = [
            `⚔️ ${h.name}が魔物を撃破！ (+5G)`,
            `🌲 ${h.name}が木材を持ち帰った！ (+1木材)`,
            `⛰️ ${h.name}が探索中...`
        ];
        let evtIndex = Math.floor(Math.random() * events.length);
        addLog(events[evtIndex]);
        if (evtIndex === 0) gold += 5;
        if (evtIndex === 1) inventory.wood += 1;
        updateView();
    }

    // ログ追加ヘルパー
    function addLog(text, className = '') {
        const logSec = document.getElementById('log-section');
        const entry = document.createElement('div');
        entry.className = `log-entry ${className}`;
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
        logSec.prepend(entry);
    }

    // ゲーム開始実行
    initGame();
</script>

</body>
</html>
