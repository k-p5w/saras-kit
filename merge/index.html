<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>マージ×サバクラ：完全版モック</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 8px;
            gap: 8px;
            overflow: hidden;
            touch-action: none; /* スワイプ時の画面スクロール防止 */
        }

        /* --- 上部：ステータスバー --- */
        .status-bar {
            display: flex;
            gap: 6px 12px;
            flex-wrap: wrap;
            align-items: center;
            background: #2d2d2d;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 0.85rem;
        }
        .status-item span { font-weight: bold; color: #4CAF50; }
        .gold-item span { color: #ffd700; }
        .era-badge { background: #4a3b69; padding: 2px 6px; border-radius: 4px; border: 1px solid #7c5ac2; font-weight: bold; }

        .reset-btn {
            background: #e53935; color: white; border: none;
            padding: 4px 8px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 0.75rem; margin-left: auto;
        }

        /* --- モバイル用タブ切替ヘッダー --- */
        .mobile-tabs {
            display: none;
            gap: 4px;
            background: #252525;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .tab-btn {
            flex: 1;
            background: #333;
            color: #aaa;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #4CAF50;
            color: #fff;
        }

        /* --- メインコンテナ --- */
        .main-layout {
            display: flex;
            flex: 1;
            gap: 8px;
            min-height: 0;
        }

        /* パズル盤面エリア */
        .puzzle-section {
            flex: 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #252525;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .board-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .guide-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 8px;
            font-size: 0.75rem;
            color: #aaa;
            font-weight: bold;
        }
        .board-middle {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, min(14vw, 70px));
            grid-template-rows: repeat(5, min(14vw, 70px));
            gap: 5px;
            background: #111;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #444;
        }
        .cell {
            width: 100%; height: 100%; background: #2a2a2a; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; user-select: none; cursor: default;
        }

        .tile-card { background: var(--card-bg); color: #fff; border: 2px dashed var(--card-bd); font-size: 1.3rem; }
        .tile-mat {
            background: var(--mat-bg); color: var(--mat-fg); border: 2px solid var(--mat-bd);
            font-size: 1.5rem; box-shadow: inset 0 0 8px var(--mat-glow); cursor: pointer;
        }

        /* サイドメニュー（ショップ等） */
        .side-section {
            flex: 3;
            background: #252525;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }
        .shop-title { font-size: 0.85rem; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 2px; margin-top: 4px; }
        
        .shop-item {
            background: #333;
            padding: 6px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        .shop-item.era-item { background: #3c2a4d; border: 1px solid #7c5ac2; }
        .shop-item button {
            background: #4CAF50; color: white; border: none;
            padding: 4px 8px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 0.75rem;
        }

        /* 下部冒険ログ */
        .log-section {
            height: 110px;
            background: #111;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #333;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column-reverse;
        }
        .log-entry { margin-bottom: 2px; color: #ccc; }
        .log-entry.event { color: #ffd700; }
        .log-entry.reward { color: #4dd0e1; }
        .log-entry.goddess { color: #e1bee7; font-weight: bold; }
        .log-entry.danger { color: #ff8a80; }
        .log-entry.gameover { color: #ff6b6b; font-weight: bold; }

        /* スマホ用レスポンシブ（768px以下はタブ段階表示） */
        @media (max-width: 768px) {
            .mobile-tabs { display: flex; }
            .main-layout { flex-direction: column; }
            .side-section { display: none; } /* デフォルトで非表示 */
            .side-section.active { display: flex; flex: 1; }
            .puzzle-section { flex: 1; display: flex; }
            .puzzle-section.hidden { display: none; }
        }
    </style>
</head>
<body>

    <!-- 上部ステータスバー -->
    <div class="status-bar">
        <div class="status-item">時代: <span id="era-name" class="era-badge">原初の時代</span></div>
        <span id="inv-bar" style="display: contents;"></span>
        <div class="status-item gold-item">所持金: <span id="gold">50</span>G</div>
        <div class="status-item">パーティ数: <span id="hero-count">0</span>人</div>
        <button class="reset-btn" onclick="resetGame()">リセット</button>
    </div>

    <!-- スマホ専用段階表示（タブボタン） -->
    <div class="mobile-tabs">
        <button class="tab-btn active" onclick="switchTab('puzzle')">🎮 パズル盤面</button>
        <button class="tab-btn" onclick="switchTab('shop')">🛒 拠点・ショップ</button>
    </div>

    <!-- メインエリア -->
    <div class="main-layout">
        <!-- パズルエリア -->
        <div class="puzzle-section" id="puzzle-section">
            <div class="board-wrapper">
                <div class="guide-row">
                    <span>⬆️ 上スワイプ: <strong id="guide-up">-</strong></span>
                </div>
                <div class="board-middle">
                    <span id="guide-left" style="writing-mode: vertical-rl; font-size: 0.75rem; color: #aaa; font-weight: bold;">⬅️ 左: -</span>
                    <div class="grid" id="grid"></div>
                    <span id="guide-right" style="writing-mode: vertical-rl; font-size: 0.75rem; color: #aaa; font-weight: bold;">➡️ 右: -</span>
                </div>
                <div class="guide-row">
                    <span>⬇️ 下スワイプ: <strong id="guide-down">-</strong></span>
                </div>
            </div>
        </div>

        <!-- ショップエリア -->
        <div class="side-section" id="side-section">
            <div class="shop-title">時代の進行・進化</div>
            <div id="era-shop-list"></div>

            <div class="shop-title">資材売却</div>
            <div id="sell-list"></div>

            <div class="shop-title">施設・雇用</div>
            <div class="shop-item">
                <div><b>使い捨て勇者</b><br><small>費用: 20G</small></div>
                <button onclick="hireHero('single', 20, '使い捨て勇者')">雇う</button>
            </div>

            <div class="shop-item">
                <div><b>終身雇用勇者</b><br><small>費用: 100G</small></div>
                <button onclick="hireHero('permanent', 100, '終身勇者')">雇う</button>
            </div>

            <div class="shop-item">
                <div><b>木剣クラフト</b><br><small>木材: 10個</small></div>
                <button onclick="craftWeapon('木剣', 'wood', 10)">作成</button>
            </div>
        </div>
    </div>

    <!-- 冒険ログ -->
    <div class="log-section" id="log-section">
        <div class="log-entry">冒険の準備が整いました。</div>
    </div>

<script>
    const CONFIG = {
        completeBonus: 30,
        adventureIntervalMs: 2500,
        cardMax: 16,
    };

    const MATERIALS = {
        wood:   { name: '木材', sell: 2, cardBg: '#8d5524', cardBd: '#ffcc99', matBg: '#5c3a21', matFg: '#ffe0b2', matBd: '#ffb74d' },
        stone:  { name: '石材', sell: 3, cardBg: '#708090', cardBd: '#dcdcdc', matBg: '#3b4c5c', matFg: '#e0f7fa', matBd: '#4dd0e1' },
        copper: { name: '銅',   sell: 5, cardBg: '#b87333', cardBd: '#f4c7a1', matBg: '#6b3a1e', matFg: '#ffd9bf', matBd: '#e8895a' },
        iron:   { name: '鉄',   sell: 8, cardBg: '#4b5563', cardBd: '#b8c2d6', matBg: '#262b36', matFg: '#e6ebf5', matBd: '#8da2e0' },
    };

    const ERAS = {
        primal: { name: '原初の時代', cost: 0,   unlocked: true,  sides: { up: 'wood', down: 'wood', left: 'stone', right: 'stone' }, next: 'copper' },
        copper: { name: '銅の時代',   cost: 150, unlocked: false, sides: { up: 'wood', down: 'copper', left: 'stone', right: 'stone' }, next: 'iron' },
        iron:   { name: '鉄の時代',   cost: 500, unlocked: false, sides: { up: 'wood', down: 'copper', left: 'stone', right: 'iron' }, next: null },
    };
    let currentEra = 'primal';

    const ADVENTURE_EVENTS = [
        { weight: 30, text: h => `⚔️ ${h.name}が魔物を撃破しました！ (+5G)`, effect: () => { gold += 5; }, type: 'event' },
        { weight: 25, text: h => `🌲 ${h.name}が森林で木材を採集しました！ (+2木材)`, effect: () => { inventory.wood = (inventory.wood || 0) + 2; }, type: 'reward' },
        { weight: 20, text: h => `⛏️ ${h.name}が岩山で石材を掘り出しました！ (+2石材)`, effect: () => { inventory.stone = (inventory.stone || 0) + 2; }, type: 'reward' },
        { weight: 10, text: h => `💎 ${h.name}が隠された宝箱を発見しました！ (+15G)`, effect: () => { gold += 15; }, type: 'reward' },
        { weight: 10, text: h => `💀 ${h.name}がトラップにかかり応急手当を行いました... (-3G)`, effect: () => { gold = Math.max(0, gold - 3); }, type: 'danger' },
        { weight: 15, text: h => `⛰️ ${h.name}は静かに未開の地を探索中...`, effect: () => {}, type: '' }
    ];

    const SIZE = 5;
    const kanjiMap = { 1: '一', 2: '二', 4: '四', 8: '八', 16: '十六' };

    let board = Array(SIZE * SIZE).fill(null);
    let inventory = {};
    let gold = 50;
    let heroes = [];
    let isGameOver = false;
    let adventureTimer = null;

    function activeMaterials() { return [...new Set(Object.values(ERAS[currentEra].sides))]; }

    function setTileVars(cell, type) {
        const m = MATERIALS[type];
        cell.style.setProperty('--card-bg', m.cardBg);
        cell.style.setProperty('--card-bd', m.cardBd);
        cell.style.setProperty('--mat-bg', m.matBg);
        cell.style.setProperty('--mat-fg', m.matFg);
        cell.style.setProperty('--mat-bd', m.matBd);
        cell.style.setProperty('--mat-glow', m.matBd + '4d');
    }

    /* --- タブ切替機能（スマホ用段階表示） --- */
    function switchTab(tab) {
        const puzzleSec = document.getElementById('puzzle-section');
        const sideSec = document.getElementById('side-section');
        const btns = document.querySelectorAll('.tab-btn');

        if (tab === 'puzzle') {
            puzzleSec.classList.remove('hidden');
            sideSec.classList.remove('active');
            btns[0].classList.add('active');
            btns[1].classList.remove('active');
        } else {
            puzzleSec.classList.add('hidden');
            sideSec.classList.add('active');
            btns[0].classList.remove('active');
            btns[1].classList.add('active');
        }
    }

    function initGame() {
        board.fill(null);
        for (const k of Object.keys(MATERIALS)) {
            if (!(k in inventory)) inventory[k] = 0;
        }
        gold = 50;
        heroes = [];
        isGameOver = false;

        renderShop();
        updateDirectionGuides();

        const sides = ERAS[currentEra].sides;
        spawnTile(sides.up);
        spawnTile(sides.left);
        updateView();

        if (adventureTimer) clearInterval(adventureTimer);
        adventureTimer = setInterval(adventureLoop, CONFIG.adventureIntervalMs);
        
        addLog('ゲームを開始しました。');
    }

    function resetGame() {
        initGame();
        addLog('【リセット】盤面とステータスを初期化しました。', 'event');
    }

    function updateDirectionGuides() {
        const sides = ERAS[currentEra].sides;
        document.getElementById('guide-up').innerText = MATERIALS[sides.up].name;
        document.getElementById('guide-down').innerText = MATERIALS[sides.down].name;
        document.getElementById('guide-left').innerText = `⬅️ 左: ${MATERIALS[sides.left].name}`;
        document.getElementById('guide-right').innerText = `➡️ 右: ${MATERIALS[sides.right].name}`;
    }

    function unlockNextEra(nextEraId) {
        const eraDef = ERAS[nextEraId];
        if (gold >= eraDef.cost) {
            gold -= eraDef.cost;
            eraDef.unlocked = true;
            currentEra = nextEraId;
            
            addLog(`🎉 【時代の解放】${eraDef.name} に進化しました！`, 'event');
            renderShop();
            updateDirectionGuides();
            updateView();
        } else {
            addLog(`ゴールドが足りません！`);
        }
    }

    function renderShop() {
        const eraContainer = document.getElementById('era-shop-list');
        eraContainer.innerHTML = '';

        let nextEraKey = ERAS[currentEra].next;
        if (nextEraKey && !ERAS[nextEraKey].unlocked) {
            const nextEra = ERAS[nextEraKey];
            eraContainer.innerHTML = `
                <div class="shop-item era-item">
                    <div><b>${nextEra.name}の解放</b><br><small>費用: ${nextEra.cost} G</small></div>
                    <button onclick="unlockNextEra('${nextEraKey}')">解放</button>
                </div>
            `;
        } else {
            eraContainer.innerHTML = `<div style="font-size:0.75rem; color:#aaa; padding:4px;">最高レベルの時代に達しています。</div>`;
        }

        document.getElementById('sell-list').innerHTML = activeMaterials().map(k => {
            const m = MATERIALS[k];
            return `<div class="shop-item"><div><b>${m.name}売却</b> (1個)<br><small>➔ ${m.sell} GOLD</small></div>` +
                   `<button onclick="sellMaterial('${k}', 1)">売却</button></div>`;
        }).join('');
    }

    function spawnTile(type) {
        let emptyIndexes = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
        if (emptyIndexes.length === 0) {
            checkGameOver();
            return;
        }
        let idx = emptyIndexes[Math.floor(Math.random() * emptyIndexes.length)];
        board[idx] = { type: type, tier: 1, val: 1 };
    }

    function updateView() {
        document.getElementById('era-name').innerText = ERAS[currentEra].name;

        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        
        board.forEach((tile, idx) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (tile) {
                if (tile.tier === 1) {
                    cell.classList.add('tile-card');
                    setTileVars(cell, tile.type);
                    cell.innerText = tile.val;
                } else {
                    cell.classList.add('tile-mat');
                    setTileVars(cell, tile.type);
                    cell.innerText = kanjiMap[tile.val] || tile.val;
                    cell.onclick = () => harvestTile(idx);
                }
            }
            gridEl.appendChild(cell);
        });

        document.getElementById('inv-bar').innerHTML = activeMaterials()
            .map(k => `<div class="status-item">${MATERIALS[k].name}: <span>${inventory[k] || 0}</span></div>`).join('');
        document.getElementById('gold').innerText = gold;
        document.getElementById('hero-count').innerText = heroes.length;
    }

    function harvestTile(idx) {
        let tile = board[idx];
        if (tile && tile.tier === 2) {
            inventory[tile.type] = (inventory[tile.type] || 0) + tile.val;
            addLog(`【手動回収】${MATERIALS[tile.type].name}を${tile.val}個ストックしました。`, 'reward');
            board[idx] = null;
            
            if (isGameOver) {
                isGameOver = false;
                addLog(`✨ 盤面に空きができたため、ゲーム再開できます！`, 'event');
            }
            updateView();
        }
    }

    /* --- 完全詰み判定＆「女神の慈悲」システム --- */
    function checkGameOver() {
        let hasEmpty = board.some(v => v === null);
        if (hasEmpty) return;

        // 隣接ペアの合体可能性チェック
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                let current = board[r * SIZE + c];
                if (!current) continue;
                if (c < SIZE - 1) {
                    let right = board[r * SIZE + (c + 1)];
                    if (right && right.type === current.type && right.tier === current.tier && right.val === current.val) return;
                }
                if (r < SIZE - 1) {
                    let down = board[(r + 1) * SIZE + c];
                    if (down && down.type === current.type && down.tier === current.tier && down.val === current.val) return;
                }
            }
        }

        // 完全詰みの場合：一定確率で「女神の慈悲」発動！
        if (Math.random() < 0.8) { // 80%の確率で救済
            let maxVal = -1;
            let maxIdx = -1;

            // 盤面で最も価値の高いタイル（計算用スコア: tier * 100 + val）を探す
            board.forEach((t, i) => {
                if (t) {
                    let score = t.tier * 100 + t.val;
                    if (score > maxVal) {
                        maxVal = score;
                        maxIdx = i;
                    }
                }
            });

            if (maxIdx !== -1) {
                let removedTile = board[maxIdx];
                board[maxIdx] = null; // 最大マスを除去してスペース確保
                gold += 20; // 恵みのゴールド
                
                let matName = MATERIALS[removedTile.type].name;
                addLog(`✨ 【女神の慈悲発動！】最大のマス（${matName}）が消滅し、20Gの恵みを授かりました！`, 'goddess');
                updateView();
                return;
            }
        }

        isGameOver = true;
        addLog(`⚠️ 【詰み】盤面が埋まりました！漢数字タイルを回収するかリセットしてください。`, 'gameover');
    }

    /* --- スワイプ／キーボード入力処理 --- */
    let touchStartX = 0, touchStartY = 0;

    // タッチ開始（スマホ）
    document.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    // タッチ終了（スワイプ判定）
    document.addEventListener('touchend', e => {
        if (isGameOver) return;
        let touchEndX = e.changedTouches[0].clientX;
        let touchEndY = e.changedTouches[0].clientY;

        let dx = touchEndX - touchStartX;
        let dy = touchEndY - touchStartY;

        // スワイプ移動距離が小さすぎる場合は無視（タップ動作と区別）
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;

        let dir = null;
        if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? 'right' : 'left';
        } else {
            dir = dy > 0 ? 'down' : 'up';
        }

        handleMove(dir);
    }, { passive: true });

    // キーボード入力（PC）
    document.addEventListener('keydown', e => {
        if (isGameOver) return;
        const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
        if (dirs[e.key]) handleMove(dirs[e.key]);
    });

    function handleMove(dir) {
        if (slide(dir)) {
            let supplyType = ERAS[currentEra].sides[dir];
            spawnTile(supplyType);
            updateView();
            checkGameOver();
        }
    }

    function slide(direction) {
        let rotCount = 0;
        if (direction === 'right') rotCount = 2;
        if (direction === 'up') rotCount = 3;
        if (direction === 'down') rotCount = 1;

        for (let i = 0; i < rotCount; i++) rotateBoard();

        let changed = false;
        for (let r = 0; r < SIZE; r++) {
            let row = [];
            for (let c = 0; c < SIZE; c++) row.push(board[r * SIZE + c]);
            let { newRow, moved } = processRow(row);
            if (moved) changed = true;
            for (let c = 0; c < SIZE; c++) board[r * SIZE + c] = newRow[c];
        }

        for (let i = 0; i < (4 - rotCount) % 4; i++) rotateBoard();
        return changed;
    }

    function rotateBoard() {
        let newBoard = Array(SIZE * SIZE).fill(null);
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                newBoard[c * SIZE + (SIZE - 1 - r)] = board[r * SIZE + c];
            }
        }
        board = newBoard;
    }

    function processRow(row) {
        let filtered = row.filter(t => t !== null);
        let newRow = [];
        let moved = false;

        for (let i = 0; i < filtered.length; i++) {
            let current = filtered[i];
            let next = filtered[i + 1];

            if (next && current.type === next.type && current.tier === next.tier && current.val === next.val) {
                let newVal = current.val * 2;
                let newTier = current.tier;
                let matName = MATERIALS[current.type].name;

                if (newTier === 1 && newVal >= CONFIG.cardMax) {
                    newTier = 2;
                    newVal = 1;
                    moved = true;
                } else if (newTier === 2 && newVal >= CONFIG.cardMax) {
                    inventory[current.type] = (inventory[current.type] || 0) + CONFIG.completeBonus;
                    addLog(`🎉 【完走ボーナス】${matName}x${CONFIG.completeBonus}を獲得しました！`, 'reward');
                    newRow.push(null);
                    i++;
                    moved = true;
                    continue;
                } else {
                    moved = true;
                }

                newRow.push({ type: current.type, tier: newTier, val: newVal });
                i++;
            } else {
                newRow.push(current);
            }
        }

        if (newRow.length !== row.filter(t => t !== null).length) moved = true;
        while (newRow.length < SIZE) newRow.push(null);

        for (let i = 0; i < SIZE; i++) {
            if ((row[i] === null) !== (newRow[i] === null) || 
                (row[i] && newRow[i] && (row[i].val !== newRow[i].val || row[i].tier !== newRow[i].tier))) {
                moved = true;
            }
        }

        return { newRow, moved };
    }

    function sellMaterial(type, amount) {
        let price = MATERIALS[type].sell * amount;
        if ((inventory[type] || 0) >= amount) {
            inventory[type] -= amount;
            gold += price;
            addLog(`【売却】${MATERIALS[type].name}x${amount} を売却 (+${price}G)`);
            updateView();
        } else {
            addLog(`資材が足りません。`);
        }
    }

    function hireHero(type, cost, heroName) {
        if (gold >= cost) {
            gold -= cost;
            heroes.push({ type: type, name: heroName });
            addLog(`【雇用】${heroName}を雇いました！`, 'event');
            updateView();
        } else {
            addLog(`ゴールドが足りません。`);
        }
    }

    function craftWeapon(weaponName, matType, cost) {
        if ((inventory[matType] || 0) >= cost) {
            inventory[matType] -= cost;
            addLog(`【クラフト】${weaponName} を作成・支給しました！`, 'event');
            updateView();
        } else {
            addLog(`クラフト素材が足りません。`);
        }
    }

    function adventureLoop() {
        if (heroes.length === 0) return;
        let h = heroes[Math.floor(Math.random() * heroes.length)];

        let totalWeight = ADVENTURE_EVENTS.reduce((sum, e) => sum + e.weight, 0);
        let rand = Math.floor(Math.random() * totalWeight);
        
        let selectedEvent = ADVENTURE_EVENTS[0];
        for (let evt of ADVENTURE_EVENTS) {
            if (rand < evt.weight) {
                selectedEvent = evt;
                break;
            }
            rand -= evt.weight;
        }

        selectedEvent.effect();
        addLog(selectedEvent.text(h), selectedEvent.type);
        updateView();
    }

    function addLog(text, className = '') {
        const logSec = document.getElementById('log-section');
        const entry = document.createElement('div');
        entry.className = `log-entry ${className}`;
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
        logSec.prepend(entry);
    }

    initGame();
</script>
