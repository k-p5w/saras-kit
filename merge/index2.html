<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>マージ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 初回巨大ポップアップ -->
    <div id="king-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>👑 王様からの布告 👑</h2>
            <p>
                <strong>あなたは王様です。</strong><br><br>
                まず、勇者を雇い、冒険に出てもらいましょう！
            </p>
            <button onclick="closeKingModal()">了解した</button>
        </div>
    </div>
    <!-- 上部ステータスバー -->
    <div class="status-bar">
        <div class="status-item">時代: <span id="era-name" class="era-badge">原初の時代</span></div>
        <span id="inv-bar" style="display: contents;"></span>
        <div class="status-item gold-item">所持金: <span id="gold">1</span>G</div>
        <div class="status-item">パーティ数: <span id="hero-count">0</span>人</div>
        <button class="reset-btn" onclick="resetGame()">リセット</button>
    </div>

    <!-- スマホ専用タブ切替 -->
    <div class="mobile-tabs">
        <button class="tab-btn active" onclick="switchTab('puzzle')">🎮 パズル盤面</button>
        <button class="tab-btn" onclick="switchTab('shop')">🛒 拠点・ショップ</button>
    </div>

    <!-- メインエリア -->
    <div class="main-layout">
        <!-- パズルエリア -->
        <div class="puzzle-section" id="puzzle-section">
            <div class="board-wrapper">
                <div class="guide-row"><span class="guide-chip" id="guide-up">⬆️ -</span></div>
                <div class="board-middle">
                    <span class="guide-chip side" id="guide-left">⬅️ -</span>
                    <div class="grid" id="grid"></div>
                    <span class="guide-chip side" id="guide-right">➡️ -</span>
                </div>
                <div class="guide-row"><span class="guide-chip" id="guide-down">⬇️ -</span></div>
            </div>
        </div>

        <!-- ショップ・拠点エリア -->
        <div class="side-section" id="side-section">
            <div class="shop-title">時代の進行・進化</div>
            <div id="era-shop-list"></div>

            <div class="shop-title">施設建築・拡張</div>
            <div id="facility-list"></div>

            <div class="shop-title">酒場・仲間雇用</div>
            <div id="tavern-list"></div>

            <div class="shop-title">資材売却</div>
            <div id="sell-list"></div>

            <div class="shop-title">武具</div>
            <div id="gear-list" style="display: contents;"></div>


        </div>
    </div>

    <!-- 冒険ログ -->
    <div class="log-section" id="log-section">
        <div class="log-entry">冒険の準備が整いました。</div>
    </div>

    <!-- 依存関係の順に読み込み -->
    <script src="data.js"></script>
    <script src="system.js"></script>
    <script src="puzzle.js"></script>
    <script src="renderShop.js"></script>
    <script src="app.js"></script>
</body>

</html>
