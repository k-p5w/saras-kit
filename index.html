<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>【不定時法】江戸・元禄和時計【1秒更新】</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      font-family: "Yu Mincho", "游明朝", serif;
    }

    .clock-box {
      width: 380px;
      padding: 25px;
      background: linear-gradient(145deg, #111, #2b0000);
      color: #ffd700;

      border: 4px solid #c8a951;
      border-radius: 14px;

      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.7),
        inset 0 0 15px rgba(255, 215, 0, 0.08);
    }

    .toki-text {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .bell-text {
      font-size: 22px;
      color: #e6b422;
    }
  </style>
</head>

<body>

  <div class="clock-box">
    <div id="toki-result" class="toki-text">--</div>
    <div id="bell-result" class="bell-text">--</div>
  </div>

  <script src="clock-engine.js"></script>
  <script>
    const TokiFormatter = (data) => {
      const kokuNames = ["一つ", "二つ", "三つ", "四つ"];

      // 丑三つ時
      if (data.shiIdx === 10 && data.kokuIdx === 2) return "丑三つ時";

      // 子刻の分離（元禄式）
      if (data.shiIdx === 9) {
        const name = (data.kokuIdx < 2) ? "夜子" : "子";
        return `${name}ノ刻 ${kokuNames[data.kokuIdx]}`;
      }

      return `${data.shiName}ノ刻 ${kokuNames[data.kokuIdx]}`;
    };

    /**
     * 時の鐘の代わりに「日の出・日の入りの前後」を表示するレンダラー
     */
    const SunlightFormatter = (data) => {
      switch (data.shiName) {
        case "卯":
          return "東雲の刻";

        case "辰":
        case "巳":
          return "朝ぼらけ";

        case "午":
        case "未":
          return "白日の下";

        case "申":
          return "夕映え時";

        case "酉":
          return "誰そ彼時";

        case "戌":
          return "宵の口";

        case "亥":
        case "子":
          return "夜半過ぎ";

        case "丑":
          return "鬼門刻";

        case "寅":
          return "暁近し";

        default:
          return "";
      }
    };
    function update() {
      // エンジンからデータを取得
      const data = getTokiData(35.44, 139.63);

      // UIの更新
      document.getElementById('toki-result').innerText = TokiFormatter(data);

      // bell-result を SunlightFormatter で上書き更新
      document.getElementById('bell-result').innerText = SunlightFormatter(data);
    }


    setInterval(update, 1000);
    update();
  </script>

</body>

</html>
