<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>江戸・元禄和時計（改）</title>
  <style>
    body {
      font-family: "Yu Mincho", serif;
      text-align: center;
      background: #fdf5e6;
      padding: 50px;
    }

    .clock-box {
      border: 5px double #8b4513;
      padding: 30px;
      display: inline-block;
      background: #fff5e6;
    }

    .big-text {
      font-size: 3em;
      color: #2f4f4f;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <div class="clock-box">
    <h2>現在の不定時法（元禄風）</h2>
    <p>地点：<span id="location-name">判定中...</span></p>
    <div class="big-text" id="toki-result">--</div>
    <div id="bell-result" style="font-size: 1.5em; color: #a52a2a;">--</div>
  </div>

  <script>
    function update(lat, lon) {
      const now = new Date();
      // 経度補正（日本標準時との時差：135度との差）
      const longitudeOffset = (lon - 135) / 15;
      const doy = (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(now.getFullYear(), 0, 0)) / 86400000;
      const decl = 0.409 * Math.sin(0.0172 * (doy - 80));
      const horizon = -7.36 * Math.PI / 180;

      const cosHourAngle = (Math.sin(horizon) - Math.sin(lat * Math.PI / 180) * Math.sin(decl)) / (Math.cos(lat * Math.PI / 180) * Math.cos(decl));
      const hourAngle = Math.acos(Math.max(-1, Math.min(1, cosHourAngle))) * 180 / Math.PI / 15;

      const sunrise = 12 - hourAngle - longitudeOffset;
      const sunset = 12 + hourAngle - longitudeOffset;
      const currentTime = now.getHours() + now.getMinutes() / 60;

      const dayLen = (sunset - sunrise) / 6;
      const nightLen = (24 - (sunset - sunrise)) / 6;
      const shi = ["卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥", "子", "丑", "寅"];

      let idx, progress;
      if (currentTime >= sunrise && currentTime < sunset) {
        progress = Math.min(5.999, (currentTime - sunrise) / dayLen);
        idx = Math.floor(progress);
      } else {
        const timeFromSunset = (currentTime >= sunset) ? (currentTime - sunset) : (currentTime + (24 - sunset));
        progress = Math.min(5.999, timeFromSunset / nightLen);
        idx = 6 + Math.floor(progress);
      }

      const kokuIdx = Math.floor((progress % 1) * 4);
      const kokuNames = ["上刻", "中刻", "下刻", "終刻"]; // ご提案通り現代寄りを排除
      const bellCounts = [6, 5, 4, 9, 8, 7, 6, 5, 4, 9, 8, 7];

      document.getElementById('toki-result').innerText = `${shi[idx]}の刻 ${kokuNames[kokuIdx]}`;
      document.getElementById('bell-result').innerText = `時の鐘：${bellCounts[idx]}つ`;
    }

    // 最初に実行
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('location-name').innerText = "現在地";
          const { latitude, longitude } = pos.coords;
          update(latitude, longitude);
          setInterval(() => update(latitude, longitude), 10000);
        },
        () => {
          document.getElementById('location-name').innerText = "江戸両国";
          update(35.69, 139.79);
          setInterval(() => update(35.69, 139.79), 10000);
        }
      );
    } else {
      update(35.69, 139.79);
      setInterval(() => update(35.69, 139.79), 10000);
    }
  </script>
</body>

</html>
