<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グランプリ</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #f9f9f9;
            color: #333;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        /* テーマ切替リンク */
        .set-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .set-nav a {
            padding: 4px 12px;
            font-size: 0.8rem;
            color: #555;
            text-decoration: none;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 15px;
        }

        .set-nav a.current {
            background: #333;
            color: #fff;
            border-color: #333;
            pointer-events: none;
        }

        .load-error {
            display: none;
            background: #fdecea;
            color: #b71c1c;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        /* カード共通 */
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            text-align: left;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        /* プリセット選択エリア */
        .preset-area {
            margin-bottom: 15px;
            padding: 10px;
            background: #f1f3f5;
            border-radius: 6px;
        }

        .preset-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-preset {
            padding: 5px 10px;
            font-size: 0.8rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-preset:hover {
            background: #e2e8f0;
        }

        .btn-preset.active {
            background: #007bff;
            color: white;
            border-color: #0056b3;
        }

        .control-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-sub {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* エントリー編集エリア */
        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 8px;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-add {
            padding: 8px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .food-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fafafa;
        }

        .tag {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-remove {
            cursor: pointer;
            color: #888;
            font-weight: bold;
        }

        .tag-remove:hover {
            color: #d32f2f;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 設定セクション */
        .settings-area {
            border-top: 1px solid #eee;
            margin-top: 10px;
            padding-top: 10px;
            font-size: 0.9rem;
            text-align: center;
            color: #666;
        }

        .settings-area label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }

        /* グループ抽選結果画面 */
        .groups-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .group-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 8px;
        }

        .group-box h3 {
            font-size: 0.95rem;
            margin: 0 0 5px 0;
            color: #d32f2f;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 3px;
        }

        .group-box ul {
            margin: 0;
            padding-left: 18px;
            font-size: 0.85rem;
            text-align: left;
        }

        .final-estimate {
            font-size: 0.85rem;
            color: #555;
            text-align: center;
            margin: 0 0 10px 0;
        }

        .final-estimate.warn {
            color: #b26a00;
            font-weight: bold;
        }

        /* 対戦画面 */
        .stage-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 5px;
        }

        .progress {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .vs-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-food {
            flex: 1;
            padding: 25px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #fff;
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #333;
        }

        .btn-food:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-draw {
            width: 100%;
            padding: 10px;
            background: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 画面切り替え用 */
        .screen {
            display: none;
        }

        .active-screen {
            display: block;
        }

        /* 結果画面の装飾 */
        .result-screen h1.final-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0;
        }

        .result-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .result-card h2.ranking-title {
            font-size: 1.3rem;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        /* TOP3 (h1, h2, h3) */
        .top1-gold {
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: #b59410;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .top2-silver {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #808080;
        }

        .top3-bronze {
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            color: #a0522d;
        }

        .top1-gold::before,
        .top2-silver::before,
        .top3-bronze::before {
            content: attr(data-rank-label);
            font-size: 1.2rem;
            display: block;
            color: #888;
        }

        /* 4位, 5位 */
        .other-rank {
            font-size: 1rem;
            color: #555;
            margin: 5px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 id="heading">🏆 グランプリ 🏆</h1>
    <nav id="setNav" class="set-nav"></nav>
    <div id="loadError" class="load-error">テーマの読み込みに失敗しました。URLの「?set=」の指定と、sets フォルダ内のファイルを確認してください。</div>

    <div id="setupScreen" class="card screen active-screen">
        <h2 id="setupTitle">1. エントリー (現在: <span id="entryCount">0</span><span id="entryUnit">件</span>)</h2>

        <!-- プリセット選択 UI -->
        <div class="preset-area">
            <div class="preset-title">⚡ ジャンル別プリセット</div>
            <div class="preset-buttons" id="presetContainer"></div>
            <div class="control-buttons">
                <button class="btn-sub" id="btnSelectAll">全選択</button>
                <button class="btn-sub" id="btnClearAll">すべてクリア</button>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="newFoodInput" placeholder="新しく追加する名前を入力">
            <button class="btn-add" id="btnAdd">追加</button>
        </div>

        <button class="btn-action" id="btnGenerateGroups">グループ組み合わせ決定（エントリー完了！）</button>
        <div class="food-tags" id="foodTags"></div>
    </div>

    <div id="groupViewScreen" class="card screen">
        <h2>🎲 予選グループ決定！ 🎲</h2>
        <div id="groupsGrid" class="groups-grid"></div>
        <p id="finalEstimate" class="final-estimate"></p>

        <div class="settings-area">
            <label>
                <input type="checkbox" id="skipMatchesCheck" checked>
                消化試合を自動で短縮する（推奨）
            </label>
        </div>

        <button class="btn-action" style="margin-top:10px;" id="btnStart">グランプリ開幕！🔥</button>
    </div>

    <div id="gameScreen" class="screen">
        <div class="stage-title" id="stageTitle">予選</div>
        <div class="progress" id="progressText">第 1 / 15 戦</div>

        <div class="vs-container">
            <button id="btnA" class="btn-food"></button>
            <span style="font-weight:bold; color:#888;">VS</span>
            <button id="btnB" class="btn-food"></button>
        </div>

        <button class="btn-draw" id="btnDraw">引き分け（どっちも好き）</button>
    </div>

    <div id="resultScreen" class="result-screen screen">
        <h1 class="final-title">🎉 全日程終了！ 🎉</h1>
        <p id="hallOfFameText" style="margin-bottom: 20px; color:#666;">栄えある殿堂入りが決定しました。</p>

        <!-- 表示切り替えボタン -->
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
            <button id="btnViewTop5" class="btn-sub" style="padding: 8px 16px; font-weight: bold;">🏆 TOP5 表示</button>
            <button id="btnViewAll" class="btn-sub" style="padding: 8px 16px; font-weight: bold; background: #bbb;">📊 全ランキング表示</button>
        </div>

        <!-- TOP5カード表示 -->
        <div id="top5View" class="result-card">
            <h2 class="ranking-title">🏆 最終順位（TOP5） 🏆</h2>

            <h1 id="rank1" class="top1-gold">1位</h1>
            <h2 id="rank2" class="top2-silver">2位</h2>
            <h3 id="rank3" class="top3-bronze">3位</h3>

            <p id="rank4" class="other-rank">4位</p>
            <p id="rank5" class="other-rank">5位</p>
        </div>

        <!-- 全順位リスト表示（初期状態は非表示） -->
        <div id="allRankView" class="result-card" style="display: none; text-align: left;">
            <h2 class="ranking-title" style="text-align: center;">📊 最終全順位リスト 📊</h2>
            <div id="allRankList" style="max-height: 300px; overflow-y: auto;"></div>
        </div>

        <button class="btn-action" style="background:#333;" id="btnBackToSetup">エントリー画面に戻る</button>
    </div>

    <!-- 延長最終決戦画面 -->
    <div id="suddenDeathScreen" class="screen">
        <div class="stage-title" style="font-size: 1.4rem; color: #d32f2f;">🔥 延長戦（最終決戦） 🔥</div>
        <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px;">1位が完全同点！最後の1本勝負で真の王者を決めろ！</p>

        <div class="vs-container">
            <button id="btnSuddenA" class="btn-food" style="background: #fff3cd; border-color: #d32f2f;"></button>
            <span style="font-weight:bold; color:#d32f2f; font-size: 1.2rem;">VS</span>
            <button id="btnSuddenB" class="btn-food" style="background: #fff3cd; border-color: #d32f2f;"></button>
        </div>
    </div>

    <script>
        // =====================================================
        // テーマ一覧 ── 新しいテーマを足すときは、ここに1行追加し、
        // sets/<id>.js を作る（id は半角英数字とハイフンのみ）
        // 先頭のテーマが ?set= なしのときのデフォルト
        // =====================================================
        const SET_MENU = [
            { id: "food", label: "🍚 ごはん" },
            { id: "anime", label: "📺 アニメ" }
        ];

        // ---------- 設定（テーマ読み込み後に入る） ----------
        let cfg = null;      // 現在のテーマ設定
        let presets = {};    // { カテゴリ名: [名前, ...] }
        const GROUP_SIZE_DEFAULT = 6;
        const ADVANCE_DEFAULT = 2;
        const MIN_ENTRIES_DEFAULT = 4;
        const FINAL_WARN_MATCHES = 100;

        // ---------- エントリー状態 ----------
        let activeCategories = new Set();
        let manualFoods = [];        // 手動追加分
        let excludedFoods = new Set(); // プリセットから個別に外したもの

        // ---------- 大会進行状態 ----------
        let groupsData = [];
        let currentGroupIndex = 0;
        let currentGroupFoods = [];
        let currentMatches = [];
        let currentMatchIndex = 0;
        let finalists = [];
        let isSkipMode = true;
        let suddenDeathGroup = [];
        let fullTournamentList = [];

        const $ = (id) => document.getElementById(id);

        // ---------- 起動 ----------
        function boot() {
            const params = new URLSearchParams(location.search);
            let setId = params.get("set");
            if (!SET_MENU.some(m => m.id === setId)) setId = SET_MENU[0].id;

            renderSetNav(setId);
            bindEvents();

            const s = document.createElement("script");
            s.src = `sets/${setId}.js`;
            s.onload = () => {
                const c = (window.GRANDPRIX_SETS || {})[setId];
                if (c) init(c); else showLoadError();
            };
            s.onerror = showLoadError;
            document.head.appendChild(s);
        }

        function showLoadError() {
            $("loadError").style.display = "block";
        }

        function renderSetNav(currentId) {
            const nav = $("setNav");
            nav.innerHTML = "";
            SET_MENU.forEach(m => {
                const a = document.createElement("a");
                a.href = `?set=${m.id}`;
                a.textContent = m.label;
                if (m.id === currentId) a.className = "current";
                nav.appendChild(a);
            });
        }

        function init(config) {
            cfg = config;
            presets = cfg.presets || {};

            document.title = cfg.pageTitle || cfg.heading;
            $("heading").textContent = `🏆 ${cfg.heading} 🏆`;
            $("entryUnit").textContent = cfg.unit || "件";
            $("newFoodInput").placeholder = `新しい${cfg.itemLabel}を入力`;
            $("hallOfFameText").textContent = `栄えある「${cfg.hallOfFame}」が決定しました。`;

            // デフォルトで選択状態にするカテゴリ（存在するものだけ）
            activeCategories = new Set((cfg.defaultCategories || []).filter(c => presets[c]));

            setupAnalytics(cfg.analyticsId);
            renderPresets();
            renderTags();
        }

        function setupAnalytics(id) {
            if (!id) return;
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { window.dataLayer.push(arguments); };
            window.gtag("js", new Date());
            window.gtag("config", id);
            const s = document.createElement("script");
            s.async = true;
            s.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(id)}`;
            document.head.appendChild(s);
        }

        function bindEvents() {
            $("btnSelectAll").onclick = selectAllPresets;
            $("btnClearAll").onclick = clearAllFoods;
            $("btnAdd").onclick = addFood;
            $("newFoodInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addFood(); });
            $("btnGenerateGroups").onclick = generateGroups;
            $("btnStart").onclick = startTournament;
            $("btnA").onclick = () => vote(1);
            $("btnB").onclick = () => vote(0);
            $("btnDraw").onclick = () => vote(0.5);
            $("btnViewTop5").onclick = () => toggleRankView("top5");
            $("btnViewAll").onclick = () => toggleRankView("all");
            $("btnBackToSetup").onclick = () => showScreen("setupScreen");
        }

        // ---------- ユーティリティ ----------
        function showScreen(screenId) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active-screen"));
            $(screenId).classList.add("active-screen");
        }

        // Fisher–Yates シャッフル（偏りのない並べ替え）
        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function groupLabel(n) {
            let name = "";
            do {
                name = String.fromCharCode(65 + (n % 26)) + name;
                n = Math.floor(n / 26) - 1;
            } while (n >= 0);
            return name;
        }

        // ---------- エントリー管理 ----------
        // 現在のエントリー一覧 = 選択中プリセット（外したものを除く）+ 手動追加
        function currentList() {
            const list = [];
            const seen = new Set();
            activeCategories.forEach(cat => {
                (presets[cat] || []).forEach(food => {
                    if (!excludedFoods.has(food) && !seen.has(food)) {
                        seen.add(food);
                        list.push(food);
                    }
                });
            });
            manualFoods.forEach(food => {
                if (!seen.has(food)) {
                    seen.add(food);
                    list.push(food);
                }
            });
            return list;
        }

        function renderPresets() {
            const container = $("presetContainer");
            container.innerHTML = "";
            Object.keys(presets).forEach(cat => {
                const btn = document.createElement("button");
                btn.className = "btn-preset" + (activeCategories.has(cat) ? " active" : "");
                btn.textContent = cat;
                btn.onclick = () => toggleCategory(cat);
                container.appendChild(btn);
            });
        }

        function toggleCategory(cat) {
            if (activeCategories.has(cat)) {
                activeCategories.delete(cat);
            } else {
                activeCategories.add(cat);
                // 入れ直したときは、そのカテゴリの「外した」状態をリセット
                (presets[cat] || []).forEach(f => excludedFoods.delete(f));
            }
            renderPresets();
            renderTags();
        }

        function selectAllPresets() {
            Object.keys(presets).forEach(cat => {
                activeCategories.add(cat);
                (presets[cat] || []).forEach(f => excludedFoods.delete(f));
            });
            renderPresets();
            renderTags();
        }

        function clearAllFoods() {
            activeCategories.clear();
            manualFoods = [];
            excludedFoods.clear();
            renderPresets();
            renderTags();
        }

        function renderTags() {
            const container = $("foodTags");
            container.innerHTML = "";
            const list = currentList();
            list.forEach(food => {
                const tag = document.createElement("div");
                tag.className = "tag";

                const label = document.createElement("span");
                label.textContent = food;

                const remove = document.createElement("span");
                remove.className = "tag-remove";
                remove.textContent = "×";
                remove.onclick = () => removeFood(food);

                tag.appendChild(label);
                tag.appendChild(remove);
                container.appendChild(tag);
            });
            $("entryCount").textContent = list.length;
        }

        function addFood() {
            const input = $("newFoodInput");
            const name = input.value.trim();
            if (!name) return;
            if (!currentList().includes(name)) {
                excludedFoods.delete(name);
                manualFoods.push(name);
                renderTags();
            }
            input.value = "";
        }

        function removeFood(name) {
            manualFoods = manualFoods.filter(f => f !== name);
            excludedFoods.add(name);
            renderTags();
        }

        // ---------- グループ分け ----------
        function generateGroups() {
            const list = currentList();
            const minEntries = cfg.minEntries || MIN_ENTRIES_DEFAULT;
            if (list.length < minEntries) {
                alert(`最低${minEntries}つの${cfg.itemLabel}が必要です！プリセットを選択するか追加してください。`);
                return;
            }

            const groupSize = cfg.groupSize || GROUP_SIZE_DEFAULT;
            const advance = cfg.advancePerGroup || ADVANCE_DEFAULT;
            const shuffled = shuffle(list);
            const groupCount = Math.max(2, Math.ceil(shuffled.length / groupSize));

            groupsData = [];
            for (let i = 0; i < groupCount; i++) {
                groupsData.push({ name: `予選グループ ${groupLabel(i)}`, foods: [] });
            }
            shuffled.forEach((food, idx) => {
                groupsData[idx % groupCount].foods.push(food);
            });

            const grid = $("groupsGrid");
            grid.innerHTML = "";
            groupsData.forEach(g => {
                const box = document.createElement("div");
                box.className = "group-box";
                const h3 = document.createElement("h3");
                h3.textContent = g.name;
                const ul = document.createElement("ul");
                g.foods.forEach(f => {
                    const li = document.createElement("li");
                    li.textContent = f;
                    ul.appendChild(li);
                });
                box.appendChild(h3);
                box.appendChild(ul);
                grid.appendChild(box);
            });

            // 決勝の規模の目安（総当たり n(n-1)/2 戦）
            const finalCount = groupsData.reduce((sum, g) => sum + Math.min(advance, g.foods.length), 0);
            const finalMatches = finalCount * (finalCount - 1) / 2;
            const est = $("finalEstimate");
            est.textContent = `決勝は ${finalCount}${cfg.unit || "件"}・総当たりで最大 ${finalMatches} 戦になります。`;
            if (finalMatches > FINAL_WARN_MATCHES) {
                est.textContent += `長くなりそうなので、エントリーを絞るのがおすすめです。`;
                est.className = "final-estimate warn";
            } else {
                est.className = "final-estimate";
            }

            showScreen("groupViewScreen");
        }

        // ---------- 大会進行 ----------
        function startTournament() {
            isSkipMode = $("skipMatchesCheck").checked;
            currentGroupIndex = 0;
            finalists = [];
            showScreen("gameScreen");
            startGroup(currentGroupIndex);
        }

        function startGroup(index) {
            let groupName;
            let foodNames;

            if (index < groupsData.length) {
                groupName = groupsData[index].name;
                foodNames = groupsData[index].foods;
            } else {
                groupName = "👑 決勝グランプリ 👑";
                foodNames = finalists;
            }

            $("stageTitle").textContent = groupName;
            currentGroupFoods = foodNames.map(name => ({
                name: name,
                rating: 1500,
                wins: 0,
                losses: 0,
                finished: false
            }));

            currentMatches = [];
            for (let i = 0; i < currentGroupFoods.length; i++) {
                for (let j = i + 1; j < currentGroupFoods.length; j++) {
                    currentMatches.push([currentGroupFoods[i], currentGroupFoods[j]]);
                }
            }
            currentMatches = shuffle(currentMatches);
            currentMatchIndex = 0;

            showMatch();
        }

        function showMatch() {
            if (currentMatchIndex >= currentMatches.length) {
                finishGroup();
                return;
            }

            const match = currentMatches[currentMatchIndex];

            if (isSkipMode && (match[0].finished || match[1].finished)) {
                currentMatchIndex++;
                showMatch();
                return;
            }

            $("btnA").textContent = match[0].name;
            $("btnB").textContent = match[1].name;

            const total = isSkipMode ? "進行中" : currentMatches.length;
            $("progressText").textContent = `判定中... (${currentMatchIndex + 1} / ${total})`;
        }

        function vote(score) {
            const match = currentMatches[currentMatchIndex];
            const a = match[0];
            const b = match[1];

            if (score === 1) { a.wins++; b.losses++; a.rating += 32; b.rating -= 16; }
            else if (score === 0) { b.wins++; a.losses++; b.rating += 32; a.rating -= 16; }
            else { a.rating += 5; b.rating += 5; }

            if (isSkipMode) {
                if (a.losses >= 2 || a.wins >= 2) a.finished = true;
                if (b.losses >= 2 || b.wins >= 2) b.finished = true;
            }

            currentMatchIndex++;
            showMatch();
        }

        function sortByScore(list) {
            return [...list].sort((a, b) => {
                if (b.rating !== a.rating) return b.rating - a.rating;
                if (b.wins !== a.wins) return b.wins - a.wins;
                return a.losses - b.losses;
            });
        }

        function finishGroup() {
            const sorted = sortByScore(currentGroupFoods);

            if (currentGroupIndex < groupsData.length) {
                const advance = cfg.advancePerGroup || ADVANCE_DEFAULT;
                finalists.push(...sorted.slice(0, advance).map(f => f.name));
                currentGroupIndex++;
                startGroup(currentGroupIndex);
                return;
            }

            // 決勝グランプリ終了時の判定
            fullTournamentList = sorted;
            const top1 = sorted[0];
            const topCandidates = sorted.filter(f =>
                f.rating === top1.rating &&
                f.wins === top1.wins &&
                f.losses === top1.losses
            );

            if (topCandidates.length >= 2) {
                suddenDeathGroup = [...topCandidates];
                runNextSuddenDeathMatch();
            } else {
                showFinalResult(sorted);
            }
        }

        // ---------- 延長戦（同率1位の勝ち抜き） ----------
        function runNextSuddenDeathMatch() {
            if (suddenDeathGroup.length === 1) {
                suddenDeathGroup[0].rating += 1; // 単独1位にするための最終ボーナス
                showFinalResult(sortByScore(fullTournamentList));
                return;
            }

            const foodA = suddenDeathGroup[0];
            const foodB = suddenDeathGroup[1];

            $("btnSuddenA").textContent = foodA.name;
            $("btnSuddenA").onclick = () => resolveSuddenMatch(foodB);

            $("btnSuddenB").textContent = foodB.name;
            $("btnSuddenB").onclick = () => resolveSuddenMatch(foodA);

            showScreen("suddenDeathScreen");
        }

        // 敗者を除外して次へ（残り1人になるまで続く）
        function resolveSuddenMatch(loser) {
            suddenDeathGroup = suddenDeathGroup.filter(f => f.name !== loser.name);
            runNextSuddenDeathMatch();
        }

        // ---------- 結果表示 ----------
        function toggleRankView(viewType) {
            const isTop5 = viewType === "top5";
            $("top5View").style.display = isTop5 ? "block" : "none";
            $("allRankView").style.display = isTop5 ? "none" : "block";
            $("btnViewTop5").style.background = isTop5 ? "#6c757d" : "#bbb";
            $("btnViewAll").style.background = isTop5 ? "#bbb" : "#6c757d";
        }

        // 同点なら同順位にする
        function getActualRank(index, data) {
            if (!data[index]) return index + 1;
            const firstIndex = data.findIndex(item =>
                item.rating === data[index].rating &&
                item.wins === data[index].wins &&
                item.losses === data[index].losses
            );
            return firstIndex + 1;
        }

        function showFinalResult(data) {
            showScreen("resultScreen");

            const medals = ["🥇", "🥈", "🥉"];
            const getMedal = (rank) => medals[rank - 1] || "🏅";
            const rankColor = (rank) => {
                if (rank === 1) return "#b59410";
                if (rank === 2) return "#808080";
                if (rank === 3) return "#a0522d";
                return "#333";
            };

            // TOP3（メダル枠）
            ["rank1", "rank2", "rank3"].forEach((id, i) => {
                const el = $(id);
                if (data[i]) {
                    const r = getActualRank(i, data);
                    el.textContent = data[i].name;
                    el.setAttribute("data-rank-label", `${getMedal(r)} ${r}位`);
                    el.style.color = rankColor(r);
                } else {
                    el.textContent = "---";
                    el.setAttribute("data-rank-label", "");
                }
            });

            // 4位・5位
            $("rank4").textContent = data[3] ? `${getActualRank(3, data)}位: ${data[3].name}` : "4位: ---";
            $("rank5").textContent = data[4] ? `${getActualRank(4, data)}位: ${data[4].name}` : "5位: ---";

            // 全順位リスト
            const listContainer = $("allRankList");
            listContainer.innerHTML = "";
            const ol = document.createElement("ol");
            ol.style.paddingLeft = "25px";
            ol.style.margin = "0";

            data.forEach((item, index) => {
                const li = document.createElement("li");
                li.style.padding = "6px 0";
                li.style.borderBottom = "1px dashed #eee";
                li.style.fontSize = "0.95rem";

                const strong = document.createElement("strong");
                strong.textContent = `${getActualRank(index, data)}位: ${item.name}`;

                const pt = document.createElement("span");
                pt.style.cssText = "color:#d32f2f; font-weight:bold;";
                pt.textContent = ` - ${item.rating} pt `;

                const record = document.createElement("span");
                record.style.cssText = "font-size:0.85rem; color:#666;";
                record.textContent = `(${item.wins}勝 ${item.losses}敗)`;

                li.appendChild(strong);
                li.appendChild(pt);
                li.appendChild(record);
                ol.appendChild(li);
            });
            listContainer.appendChild(ol);

            toggleRankView("top5");
        }

        boot();
    </script>

</body>

</html>
